<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zunesty — Acquisition summary</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAFAF7;--ink:#101816;--mute:#5E6A63;--rule:#D9DED9;--rule2:#EAEEEA;--forest:#1E4620;--moss:#5F7C63;--wash:#EEF3EE;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0E1412;--ink:#EDEFEA;--mute:#A9B3AA;--rule:#2A3630;--rule2:#1D2722;--forest:#9FD3A3;--moss:#7FA884;--wash:#172019}}
:root[data-theme="dark"]{--paper:#0E1412;--ink:#EDEFEA;--mute:#A9B3AA;--rule:#2A3630;--rule2:#1D2722;--forest:#9FD3A3;--moss:#7FA884;--wash:#172019}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;line-height:1.45}
.page{max-width:1040px;margin:0 auto;padding:36px 22px 60px}
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--forest)}
.mast h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em;color:var(--forest)}.mast h1 small{font-weight:400;color:var(--mute);font-size:15px;margin-left:10px}
.meta{font-size:13px;color:var(--mute);text-align:right;line-height:1.5}.meta b{color:var(--ink);font-weight:500}
.strip{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--rule);margin-bottom:8px}
.strip>div{padding:18px 14px 16px 0;border-right:1px solid var(--rule2)}.strip>div:last-child{border-right:0}.strip>div+div{padding-left:14px}
.strip .f{font-size:28px;font-weight:300;letter-spacing:-.02em;line-height:1.05}.strip .l{font-size:12.5px;color:var(--mute);margin-top:6px}.strip .d{font-size:12.5px;color:var(--moss);font-weight:500;margin-top:2px}
section{padding:26px 0 8px;border-bottom:1px solid var(--rule)}section:last-of-type{border-bottom:0}
h2{font-size:17px;font-weight:600;margin:0 0 14px;color:var(--forest)}
p.note{font-size:13px;color:var(--mute);margin:12px 0 0;max-width:78ch}
.chart{width:100%;height:auto;display:block}.g{stroke:var(--rule2)}.base{stroke:var(--rule)}.ax,.v{font-size:11px;fill:var(--mute);font-family:inherit}.xl{font-size:12.5px;fill:var(--ink);font-weight:500;font-family:inherit}.b1{fill:var(--forest)}.b2{fill:var(--forest);opacity:.38}
.legend{display:flex;gap:18px;font-size:12.5px;color:var(--mute);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;background:var(--forest)}.legend i.s{opacity:.38}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{text-align:left;font-weight:500;color:var(--mute);font-size:12.5px;padding:8px 10px 8px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:12px 10px 12px 0;border-bottom:1px solid var(--rule2);vertical-align:top}tbody tr:last-child td{border-bottom:0}.n{text-align:right;white-space:nowrap}th.n{text-align:right}
td.id,.cc .id{color:var(--forest);font-weight:600}.ind{font-weight:500}.sc{font-size:12.5px;color:var(--mute);margin-top:2px}
tfoot td{border-top:1px solid var(--rule);font-weight:500}
.cards{display:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--rule2);font-size:14px}.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--mute)}.kv span:last-child{text-align:right;font-weight:500;max-width:60%}
.mrow{display:grid;grid-template-columns:150px 1fr 48px;align-items:center;gap:12px;padding:8px 0;font-size:14px}.mrow span:first-child{color:var(--mute)}.mbar{height:8px;background:var(--rule2)}.mbar i{display:block;height:100%;background:var(--forest)}
.margins{display:flex;gap:28px;margin-top:12px;padding-top:12px;border-top:1px solid var(--rule)}.margins div{font-size:14px}.margins b{display:block;font-size:22px;font-weight:300}
ol.reasons{margin:0;padding-left:20px;font-size:14px;line-height:1.6;max-width:78ch}ol.reasons li{margin-bottom:8px}ol.reasons b{font-weight:500}
ul.docs{columns:2;gap:32px;margin:0;padding-left:18px;font-size:13.5px;line-height:1.8}
a{color:var(--forest)}
#gate[hidden]{display:none}#gate{position:fixed;inset:0;background:var(--paper);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
#gate form{width:100%;max-width:400px}#gate h1{font-size:22px;font-weight:600;color:var(--forest);margin:0 0 6px}#gate p{font-size:14px;color:var(--mute);margin:0 0 20px;line-height:1.5}
#gate label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}#gate input[type=password]{width:100%;padding:11px 12px;font:inherit;font-size:15px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:4px}
#gate input:focus{outline:2px solid var(--forest);outline-offset:1px}#gate .chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin:16px 0;color:var(--ink)}
#gate button{width:100%;padding:12px;font:inherit;font-size:15px;font-weight:600;background:var(--forest);color:#fff;border:0;border-radius:4px;cursor:pointer;margin-top:4px}#gate button:focus{outline:2px solid var(--ink);outline-offset:2px}
#gate .fine{font-size:12px;color:var(--mute);margin-top:14px}body.locked{overflow:hidden}
footer{margin-top:32px;padding-top:14px;border-top:2px solid var(--forest);font-size:12.5px;color:var(--mute);line-height:1.6;max-width:90ch}
@media(max-width:780px){
.page{padding:22px 18px 48px}.mast{display:block}.meta{text-align:left;margin-top:8px}
.strip{grid-template-columns:1fr 1fr}.strip>div{padding:14px 12px 12px 0;border-right:0;border-bottom:1px solid var(--rule2)}.strip>div:nth-child(odd){border-right:1px solid var(--rule2)}.strip>div:nth-child(even){padding-left:12px}.strip>div:nth-last-child(-n+2){border-bottom:0}.strip .f{font-size:24px}
.desk{display:none}.cards{display:block}
.cc{padding:14px 0;border-bottom:1px solid var(--rule2)}.cc:last-child{border-bottom:0}.cc-h{display:flex;align-items:baseline;gap:10px}.cc-h .ind{flex:1;font-size:15px}.cc-h .mrr{font-weight:600;font-size:16px}
.cc dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:10px 0 0;font-size:13px}.cc dt{color:var(--mute);font-size:12px}.cc dd{margin:2px 0 0;font-weight:500}
.two{grid-template-columns:1fr;gap:0}.two>div+div{margin-top:26px;padding-top:22px;border-top:1px solid var(--rule)}
.mrow{grid-template-columns:120px 1fr 44px}ul.docs{columns:1}
}
</style></head><body><div id="vault"></div>
